<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>루틴체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&text=루틴체크&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF7EF;
    --paper-dot: #E9E1D0;
    --ink: #2E2B26;
    --ink-soft: #6B6558;
    --line: #DDD4C0;
    --card: #FFFFFF;
    --green: #4C8E5F;
    --green-bg: #E4EFE0;
    --amber: #C98A2E;
    --amber-bg: #F6E9D2;
    --red: #B4574A;
    --red-bg: #F3E0DA;
    --gray: #B7AF9E;
    --accent: #3E5C6E;
    --shadow: 0 1px 2px rgba(46,43,38,0.06), 0 4px 14px rgba(46,43,38,0.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--paper);}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    background-image: radial-gradient(var(--paper-dot) 1px, transparent 1px);
    background-size: 16px 16px;
    overscroll-behavior-y: contain;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:100px; position:relative;}

  header{padding:22px 20px 6px; display:flex; align-items:flex-start; justify-content:space-between;}
  header h1{font-size:22px; font-weight:800; margin:0; letter-spacing:-0.3px;}
  header p.sub{margin:3px 0 0; font-size:12.5px; color:var(--ink-soft);}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.94);}

  /* mode switcher */
  .mode-switch{display:flex; gap:8px; padding:14px 20px 0;}
  .mode-switch button{
    flex:1; padding:10px 0; border-radius:12px; border:1.5px solid var(--line); background:var(--card);
    font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .mode-switch button.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  .week-strip{display:flex; gap:6px; padding:14px 16px 4px; overflow-x:auto;}
  .day-pill{
    flex:1; min-width:40px; border-radius:14px; padding:8px 0 7px; text-align:center;
    border:1px solid transparent; cursor:pointer; background:transparent;
  }
  .day-pill .wd{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .day-pill .num{font-size:15px; font-weight:700; margin-top:2px;}
  .day-pill.today .wd{color:var(--accent);}
  .day-pill.selected{background:var(--ink); border-color:var(--ink);}
  .day-pill.selected .wd, .day-pill.selected .num{color:#fff;}
  .day-pill.sun .wd{color:#B4574A;}
  .day-pill.sat .wd{color:#3E5C6E;}

  .section-label{padding:16px 20px 6px; font-size:13px; font-weight:700; color:var(--ink-soft);}
  .section-label-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 0; font-size:13px; font-weight:700; color:var(--ink-soft);
  }
  .mini-toggle{
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:14px; cursor:pointer; font-family:inherit;
  }
  .mini-toggle.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .cat-group-label{
    display:flex; align-items:center; gap:7px; margin:10px 16px 0; padding:9px 12px;
    font-size:13px; font-weight:800; color:var(--ink); cursor:pointer; user-select:none;
    background:rgba(255,255,255,0.7); border:1px solid var(--line); border-radius:12px;
  }
  .cat-group-label:active{background:#fff;}
  .cat-group-label .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .cat-group-label .cat-name{flex:1;}
  .cat-count{font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px; background:#EFE9DC; color:var(--ink-soft);}
  .chev{display:flex; color:var(--ink-soft); transition:transform .2s;}
  .chev.closed{transform:rotate(-90deg);}

  .routine-list{padding:6px 16px 0; display:flex; flex-direction:column; gap:6px;}
  .routine-card{
    background:var(--card); border-radius:12px; box-shadow:var(--shadow);
    display:flex; align-items:center; padding:8px 12px 8px 0;
    position:relative; overflow:hidden; border:1px solid var(--line);
    user-select:none;
  }
  .routine-card .tab{width:5px; align-self:stretch; border-radius:3px 0 0 3px; margin-right:11px; flex-shrink:0;}
  .routine-card .body{flex:1; min-width:0;}
  .routine-card .name{font-size:14.5px; font-weight:700; line-height:1.3;}
  .routine-card .name.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--gray);}
  .routine-card .meta{font-size:11px; color:var(--ink-soft); margin-top:1px; display:flex; align-items:center; gap:5px; min-width:0;}
  .memo-dot{width:5px; height:5px; border-radius:50%; background:var(--accent); display:inline-block; flex-shrink:0;}
  .memo-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}

  .check-btn{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-right:11px; flex-shrink:0;
    background:#fff; transition: background .15s, border-color .15s, transform .12s;
  }
  .check-btn.checked{transform:scale(1.04);}
  .check-btn svg{width:15px; height:15px;}
  .check-btn path{stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .28s ease;}
  .check-btn.checked path{stroke-dashoffset:0;}

  .rate-chip{font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:8px; flex-shrink:0; margin-right:2px;}

  .empty-state{padding:60px 30px; text-align:center; color:var(--ink-soft);}
  .empty-state .big{font-size:36px; margin-bottom:10px;}
  .empty-state p{font-size:14px; line-height:1.6; margin:0;}
  .empty-state-small{padding:22px 10px; text-align:center; color:var(--ink-soft); font-size:13px;}

  .fab{
    position:fixed; right:calc(50% - 240px + 22px); bottom:26px;
    width:56px; height:56px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:400;
    box-shadow:0 6px 18px rgba(46,43,38,0.28); border:none; cursor:pointer; z-index:40;
  }
  @media (max-width:480px){ .fab{right:22px;} }
  .fab:active{transform:scale(0.94);}

  .overlay{
    position:fixed; inset:0; background:rgba(46,43,38,0.42); z-index:60;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:10px 20px 26px; max-height:88vh; overflow-y:auto;
    animation: slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 14px;}
  .sheet h2{font-size:17px; margin:0 0 16px; font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); font-size:13.5px; font-weight:600; cursor:pointer; background:#fff; color:var(--ink-soft);}
  .chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .weekday-chip{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0;}
  .color-row{display:flex; flex-wrap:wrap; gap:10px;}
  .color-swatch{width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent;}
  .color-swatch.active{border-color:var(--ink);}
  .cat-select-row{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-select{padding:7px 12px; border-radius:16px; font-size:13px; font-weight:700; cursor:pointer; border:1.5px solid transparent;}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-secondary{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-danger{background:var(--red-bg); color:var(--red);}
  .btn:active{transform:scale(0.98);}

  .manage-row{display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; gap:10px;}
  .manage-row .dot{width:12px; height:12px; border-radius:50%; flex-shrink:0;}
  .manage-row .info{flex:1; min-width:0;}
  .manage-row .info .t{font-size:14px; font-weight:700;}
  .manage-row .info .s{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .manage-row .act{display:flex; gap:6px;}
  .icon-sm{width:30px; height:30px; border-radius:8px; background:#F3EFE4; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; flex-shrink:0;}
  .tabbar{display:flex; gap:8px; margin-bottom:16px;}
  .tabbar button{flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .tabbar button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* todo view */
  .todo-section{padding:0 16px; margin-top:6px;}
  .todo-section-title{font-size:13px; font-weight:700; color:var(--ink-soft); padding:10px 4px 8px; display:flex; align-items:center; gap:6px;}
  .todo-list{display:flex; flex-direction:column; gap:8px;}
  .todo-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
  }
  .todo-check{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .todo-check.checked{background:var(--accent); border-color:var(--accent);}
  .todo-check svg{width:14px; height:14px;}
  .todo-check path{stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .22s;}
  .todo-check.checked path{stroke-dashoffset:0;}
  .todo-text{flex:1; font-size:14.5px; font-weight:600; word-break:break-word;}
  .todo-text.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--gray);}
  .todo-del{width:26px; height:26px; border-radius:50%; border:none; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px; font-family:inherit; background:#fff;}
  .add-row button{
    width:42px; height:42px; border-radius:10px; border:none; background:var(--ink); color:#fff; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .add-row button:active{transform:scale(0.95);}

  /* ===== Loop-style: cream + slate blue + wave ===== */
  :root{
    --paper:#FFFBE8; --ink:#2F4A66; --ink-soft:#6F8499; --line:#D9DEC9; --card:#FFFFFF;
    --green:#4E9B7E; --green-bg:#DDF0E5; --amber:#D69A3A; --amber-bg:#FBEBC8;
    --red:#D2675C; --red-bg:#F9DAD4; --gray:#B9C3CC; --accent:#2F4A66;
    --sky:#A9CDF0; --shadow:none;
  }
  html,body{background:#FFFBE8;}
  body{background-image:none; background:#FFFBE8;}
  #app{padding-bottom:130px;}
  header.top{padding:14px 18px 0; display:block;}
  .top-title{display:flex; align-items:center; justify-content:space-between;}
  header.top h1{font-family:'Gaegu','Pretendard',sans-serif; font-size:34px; font-weight:700; color:#4F6F8F; letter-spacing:0; margin:0; line-height:1;}
  .top-spacer{width:38px;}
  header.top .icon-btn{width:38px; height:38px; border:1.5px solid #2F4A66; background:transparent; box-shadow:none;}
  .wave{display:block; width:100%; height:18px; margin:8px 0 6px;}
  .greet{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 0;}
  .greet-sub{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .greet-date{font-size:21px; font-weight:800; color:#1E3550; margin-top:1px; letter-spacing:-.3px;}
  .mascot{width:50px; height:50px; flex-shrink:0;}
  .week-strip{padding:12px 12px 2px;}
  .day-pill{border-radius:14px; padding:7px 0 6px; border:1.5px solid transparent;}
  .day-pill .wd{font-size:10.5px;}
  .day-pill .num{font-size:14px;}
  .day-pill.selected{background:#FFF1A6; border-color:#2F4A66; box-shadow:none;}
  .day-pill.selected .wd,.day-pill.selected .num{color:#1E3550;}
  .day-pill.today:not(.selected) .num{color:#D2675C;}
  .section-label-row{padding:14px 18px 0;}
  .mini-toggle{background:transparent; border:1.5px solid #2F4A66; color:#2F4A66;}
  .mini-toggle.on{background:#2F4A66; color:#fff;}
  .cat-group-label{background:transparent; border:none; border-bottom:1.5px solid rgba(47,74,102,.28); border-radius:0; padding:9px 4px 7px; margin:12px 18px 0;}
  .cat-group-label:active{background:rgba(169,205,240,.2);}
  .cat-count{background:#D3E6F8; color:#2F4A66;}
  .routine-list{padding:8px 16px 0; gap:8px;}
  .routine-card{background:#E1EEFA; border:1px solid rgba(47,74,102,.30); border-bottom:2.5px solid rgba(47,74,102,.55); border-radius:14px; padding:9px 12px 9px 0; box-shadow:none;}
  .routine-card .tab{width:0; margin-right:12px;}
  .check-btn{width:28px; height:28px; border-width:1.8px; background:rgba(255,255,255,.7);}
  .routine-card .name{font-size:14.5px; color:#1E3550;}
  .rate-chip{background:rgba(255,255,255,.75)!important; border-radius:12px;}
  .todo-row{background:#E1EEFA; border:1px solid rgba(47,74,102,.30); border-bottom:2.5px solid rgba(47,74,102,.55); border-radius:14px; box-shadow:none;}
  .todo-check{border-color:rgba(47,74,102,.5); background:rgba(255,255,255,.7); border-radius:50%;}
  .todo-check.checked{background:#2F4A66; border-color:#2F4A66;}
  .add-row input{border:1.5px solid rgba(47,74,102,.45); background:rgba(255,255,255,.7); border-radius:14px;}
  .add-row button{background:#2F4A66; border-radius:14px;}
  .todo-section-title{color:#2F4A66;}
  .empty-state-small{color:var(--ink-soft);}
  .sheet{background:#FFFBE8;}
  .field input[type=text],.field input[type=number],.field textarea{border:1.5px solid rgba(47,74,102,.45); border-radius:12px;}
  .btn-primary{background:#2F4A66;}
  .chip.active,.tabbar button.active{background:#2F4A66; border-color:#2F4A66;}

  .nav-fade{position:fixed; left:0; right:0; bottom:0; height:96px; z-index:40; pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,251,232,0), #FFFBE8 70%);}
  .nav-add{
    position:fixed; z-index:50; width:58px; height:58px; border-radius:22px; cursor:pointer;
    right:max(18px, calc(50% - 240px + 18px)); bottom:calc(18px + env(safe-area-inset-bottom));
    background:#2F4A66; border:1.5px solid #2F4A66; border-bottom-width:3px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(47,74,102,.25);
  }
  .nav-add:active{transform:scale(.94);}
  #app{padding-bottom:110px;}

  .mode-switch{display:flex; gap:5px; margin:10px 16px 0; padding:5px; height:48px;
    background:#E1EEFA; border:1.5px solid #2F4A66; border-bottom-width:3px; border-radius:18px;}
  .mode-switch button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:0;
    background:transparent; border:1.5px solid transparent; border-radius:13px;
    color:#6F8499; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .mode-switch button.active{background:#FFF1A6; border-color:#2F4A66; color:#1E3550; box-shadow:none;}
  .mode-switch button:active{transform:scale(.97);}
  .toast{bottom:110px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const PALETTE = ['#4F6F8F','#E58F65','#7FB59A','#D9B44A','#9A86C2','#D77B9B','#5E9E9E','#2F4A66'];
const WEEKDAYS = ['일','월','화','수','목','금','토'];

let config = { categories: [], routines: [] };
let records = {};
let todos = {};      // { 'YYYY-MM-DD': [{id,text,checked}] }
let shopping = [];   // [{id,text,checked}]
let selectedDate = new Date();
let viewMode = 'routine'; // 'routine' | 'todo'
let ui = { collapsed:{}, hideDone:false }; // 접힌 카테고리 / 완료 숨기기 상태
let editingRoutineId = null;
let editingCategoryId = null;
let memoRoutineId = null;
let settingsTab = 'routine';
let settingsOverlayOpen = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function isSameDay(a,b){ return fmtDate(a)===fmtDate(b); }

// 자체 호스팅용: 브라우저 localStorage 사용
async function loadData(){
  try{ const c = localStorage.getItem('rt_config'); config = c ? JSON.parse(c) : {categories:[],routines:[]}; }
  catch(e){ config = {categories:[],routines:[]}; }
  try{ const r = localStorage.getItem('rt_records'); records = r ? JSON.parse(r) : {}; }
  catch(e){ records = {}; }
  try{ const t = localStorage.getItem('rt_todos'); todos = t ? JSON.parse(t) : {}; }
  catch(e){ todos = {}; }
  try{ const s = localStorage.getItem('rt_shopping'); shopping = s ? JSON.parse(s) : []; }
  catch(e){ shopping = []; }
  try{ const u = localStorage.getItem('rt_ui'); if(u){ const p = JSON.parse(u); ui = { collapsed: p.collapsed||{}, hideDone: !!p.hideDone }; } }
  catch(e){}
  render();
}
async function saveConfig(){ try{ localStorage.setItem('rt_config', JSON.stringify(config)); } catch(e){ showToast('저장에 실패했어요'); } }
async function saveRecords(){ try{ localStorage.setItem('rt_records', JSON.stringify(records)); } catch(e){ showToast('저장에 실패했어요'); } }
async function saveTodos(){ try{ localStorage.setItem('rt_todos', JSON.stringify(todos)); } catch(e){ showToast('저장에 실패했어요'); } }
async function saveShopping(){ try{ localStorage.setItem('rt_shopping', JSON.stringify(shopping)); } catch(e){ showToast('저장에 실패했어요'); } }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function getRecord(dateStr, routineId){ return (records[dateStr] && records[dateStr][routineId]) || {checked:false, memo:''}; }
function setRecord(dateStr, routineId, patch){
  if(!records[dateStr]) records[dateStr] = {};
  const cur = records[dateStr][routineId] || {checked:false, memo:''};
  records[dateStr][routineId] = {...cur, ...patch};
}
function toggleCheck(routineId, dateStr){
  const cur = getRecord(dateStr, routineId);
  setRecord(dateStr, routineId, {checked: !cur.checked});
  saveRecords();
  render();
}

function routineAppliesOnDate(routine, date){
  if(routine.type === 'daily') return true;
  if(routine.type === 'days') return routine.days.includes(date.getDay());
  if(routine.type === 'count') return true;
  return false;
}
function getWeekDates(date){
  const day = date.getDay();
  const sun = new Date(date); sun.setDate(date.getDate() - day);
  const arr = [];
  for(let i=0;i<7;i++){ const d = new Date(sun); d.setDate(sun.getDate()+i); arr.push(d); }
  return arr;
}
// 고정된 주간 목표치 기준으로 달성률 계산 (매일=7, 특정요일=선택한 요일 수, 주n회=n)
function routineWeeklyRate(routine, refDate){
  const week = getWeekDates(refDate);
  if(routine.type === 'count'){
    const target = routine.count || 1;
    let done = 0;
    week.forEach(d=>{ if(getRecord(fmtDate(d), routine.id).checked) done++; });
    return { done, target, rate: Math.min(done/target, 1) };
  }
  if(routine.type === 'daily'){
    let done = 0;
    week.forEach(d=>{ if(getRecord(fmtDate(d), routine.id).checked) done++; });
    return { done, target: 7, rate: done/7 };
  }
  // days
  const target = (routine.days && routine.days.length) ? routine.days.length : 1;
  let done = 0;
  week.forEach(d=>{
    if(!routine.days.includes(d.getDay())) return;
    if(getRecord(fmtDate(d), routine.id).checked) done++;
  });
  return { done, target, rate: done/target };
}
function rateColor(rate){
  if(rate === null || rate === undefined) return {main:'var(--gray)', bg:'#EFEAE0'};
  if(rate >= 0.8) return {main:'var(--green)', bg:'var(--green-bg)'};
  if(rate >= 0.5) return {main:'var(--amber)', bg:'var(--amber-bg)'};
  return {main:'var(--red)', bg:'var(--red-bg)'};
}
function categoryById(id){ return config.categories.find(c=>c.id===id); }
function routineById(id){ return config.routines.find(r=>r.id===id); }
function typeLabel(routine){
  if(routine.type==='daily') return '매일';
  if(routine.type==='days') return routine.days.slice().sort((a,b)=>a-b).map(d=>WEEKDAYS[d]).join('·');
  if(routine.type==='count') return `주 ${routine.count}회`;
}

function renderRoutineView(){
  const dateStr = fmtDate(selectedDate);
  let html = '';

  const dayRoutines = config.routines.filter(r => routineAppliesOnDate(r, selectedDate));

  if(config.routines.length === 0){
    html += `
    <div class="empty-state">
      <div class="big">🗒️</div>
      <p>아직 등록된 루틴이 없어요.<br/>오른쪽 아래 + 버튼으로<br/>첫 루틴을 만들어보세요.</p>
    </div>`;
    return html;
  }
  if(dayRoutines.length === 0){
    html += `<div class="empty-state"><p>이 날은 예정된 루틴이 없어요.</p></div>`;
    return html;
  }

  // 카테고리 순서대로 그룹핑 (접기/펼치기 + 완료 숨기기)
  const groupOrder = [...config.categories.map(c=>c.id), null];
  const allDone = dayRoutines.every(r => getRecord(dateStr, r.id).checked);
  html += `<div class="section-label-row">
    <span>오늘의 루틴</span>
    <button class="mini-toggle ${ui.hideDone?'on':''}" onclick="toggleHideDone()">${ui.hideDone?'완료 보이기':'완료 숨기기'}</button>
  </div>`;
  if(ui.hideDone && allDone){
    html += `<div class="empty-state-small">오늘 루틴을 전부 끝냈어요 🎉</div>`;
  }
  groupOrder.forEach(catId=>{
    const all = dayRoutines.filter(r => (r.categoryId || null) === catId);
    if(all.length === 0) return;
    const cat = catId ? categoryById(catId) : null;
    const key = catId || 'none';
    const color = cat ? cat.color : 'var(--gray)';
    const doneCnt = all.filter(r => getRecord(dateStr, r.id).checked).length;
    const items = ui.hideDone ? all.filter(r => !getRecord(dateStr, r.id).checked) : all;
    if(items.length === 0) return;
    const collapsed = !!ui.collapsed[key];
    const groupDone = doneCnt === all.length;
    html += `<div class="cat-group-label" onclick="toggleGroup('${key}')">
      <span class="dot" style="background:${color}"></span>
      <span class="cat-name">${cat?escapeHtml(cat.name):'미분류'}</span>
      <span class="cat-count ${groupDone?'all':''}" style="${groupDone?`background:${color}; color:#fff;`:''}">${doneCnt}/${all.length}</span>
      <span class="chev ${collapsed?'closed':''}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </div>`;
    if(collapsed) return;
    html += `<div class="routine-list">`;
    items.forEach(r=>{
      const rec = getRecord(dateStr, r.id);
      const wr = routineWeeklyRate(r, selectedDate);
      const rc = rateColor(wr.rate);
      html += `
      <div class="routine-card" data-rid="${r.id}" ontouchstart="pressStart('${r.id}')" ontouchend="pressEnd('${r.id}')" ontouchmove="pressCancel()" onmousedown="pressStart('${r.id}')" onmouseup="pressEnd('${r.id}')" onmouseleave="pressCancel()" oncontextmenu="return false;">
        <div class="tab" style="background:${color}"></div>
        <div class="check-btn ${rec.checked?'checked':''}" style="${rec.checked?`background:${color};border-color:${color};`:`border-color:${color}88;`}" onclick="event.stopPropagation(); toggleCheck('${r.id}','${dateStr}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>
        </div>
        <div class="body">
          <div class="name ${rec.checked?'done':''}">${escapeHtml(r.name)}</div>
          <div class="meta">
            <span>${typeLabel(r)} · ${wr.done}/${wr.target}</span>
            ${rec.memo ? `<span class="memo-dot"></span><span class="memo-text">${escapeHtml(rec.memo)}</span>` : ''}
          </div>
        </div>
        <div class="rate-chip" style="background:${rc.bg}; color:${rc.main}">${Math.round(wr.rate*100)}%</div>
      </div>`;
    });
    html += `</div>`;
  });

  return html;
}

  if(settingsTab === 'routine'){
    if(config.routines.length===0){
      body = `<p style="font-size:13.5px;color:var(--ink-soft);text-align:center;padding:20px 0;">등록된 루틴이 없어요</p>`;
    } else {
      body = config.routines.map(r=>{
        const cat = categoryById(r.categoryId);
        return `<div class="manage-row">
          <div class="dot" style="background:${cat?cat.color:'var(--gray)'}"></div>
          <div class="info">
            <div class="t">${escapeHtml(r.name)}</div>
            <div class="s">${cat?cat.name:'미분류'} · ${typeLabel(r)}</div>
          </div>
          <div class="act">
            <button class="icon-sm" onclick="settingsOverlayOpen=false; openRoutineModal('${r.id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2E2B26" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="icon-sm" onclick="deleteRoutine('${r.id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4574A" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
            </button>
          </div>
        </div>`;
      }).join('');
    }
    body += `<button class="btn btn-secondary" style="width:100%;margin-top:6px;" onclick="settingsOverlayOpen=false; openRoutineModal()">+ 새 루틴 추가</button>`;
  } else {
    if(config.categories.length===0){
      body = `<p style="font-size:13.5px;color:var(--ink-soft);text-align:center;padding:20px 0;">등록된 카테고리가 없어요</p>`;
    } else {
      body = config.categories.map(c=>{
        const cnt = config.routines.filter(r=>r.categoryId===c.id).length;
        return `<div class="manage-row">
          <div class="dot" style="background:${c.color}"></div>
          <div class="info">
            <div class="t">${escapeHtml(c.name)}</div>
            <div class="s">루틴 ${cnt}개</div>
          </div>
          <div class="act">
            <button class="icon-sm" onclick="openCategoryModal('${c.id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2E2B26" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="icon-sm" onclick="deleteCategory('${c.id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4574A" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
            </button>
          </div>
        </div>`;
      }).join('');
    }
    body += `<button class="btn btn-secondary" style="width:100%;margin-top:6px;" onclick="openCategoryModal()">+ 새 카테고리 추가</button>`;
  }

  overlay.innerHTML = `
  <div class="sheet" style="max-height:82vh;">
    <div class="sheet-handle"></div>
    <h2>관리</h2>
    <div class="tabbar">
      <button class="${settingsTab==='routine'?'active':''}" onclick="setSettingsTab('routine')">루틴</button>
      <button class="${settingsTab==='category'?'active':''}" onclick="setSettingsTab('category')">카테고리</button>
    </div>
    ${body}
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-secondary" style="flex:none; width:100%;" onclick="closeSettings()">닫기</button>
    </div>
  </div>`;
}

/* ---------- todo view ---------- */
function todayStr(){ return fmtDate(new Date()); }
// 오늘 화면에서는 이전 날짜의 미완료 항목을 자동으로 끌어와 보여준다 (다음날로 이월)
function getTodosForDisplay(dateStr){
  const isToday = dateStr === todayStr();
  let result = [];
  Object.keys(todos).sort().forEach(d=>{
    if(d > dateStr) return;
    (todos[d]||[]).forEach(item=>{
      if(d === dateStr){
        result.push({...item, origin:d});
      } else if(isToday && !item.checked){
        result.push({...item, origin:d});
      }
    });
  });
  return result;
}
function findTodoLocation(id){
  for(const d in todos){
    const idx = (todos[d]||[]).findIndex(i=>i.id===id);
    if(idx>-1) return {date:d, idx};
  }
  return null;
}

function renderTodoView(){
  const dateStr = fmtDate(selectedDate);
  const dayTodos = getTodosForDisplay(dateStr);
  let html = `<div class="todo-section">`;

  html += `<div class="todo-section-title">📝 오늘 할 일</div>`;
  if(dayTodos.length === 0){
    html += `<div class="empty-state-small">아직 추가한 할 일이 없어요</div>`;
  } else {
    html += `<div class="todo-list">`;
    dayTodos.forEach(item=>{
      const carried = item.origin !== dateStr;
      html += `<div class="todo-row">
        <div class="todo-check ${item.checked?'checked':''}" onclick="toggleTodo('${item.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div class="todo-text ${item.checked?'done':''}">${escapeHtml(item.text)}</div>
          ${carried ? `<div style="font-size:10.5px; color:var(--ink-soft); margin-top:2px;">${Number(item.origin.split('-')[1])}월 ${Number(item.origin.split('-')[2])}일부터 이월</div>` : ''}
        </div>
        <button class="todo-del" onclick="deleteTodo('${item.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B7AF9E" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`;
    });
    html += `</div>`;
  }
  html += `
  <div class="add-row">
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요" onkeydown="if(event.key==='Enter') submitTodo()">
    <button onclick="submitTodo()">+</button>
  </div>`;

  html += `<div class="todo-section-title" style="margin-top:22px;">🛒 사야될 것</div>`;
  if(shopping.length === 0){
    html += `<div class="empty-state-small">장보기 목록이 비어있어요</div>`;
  } else {
    html += `<div class="todo-list">`;
    shopping.forEach(item=>{
      html += `<div class="todo-row">
        <div class="todo-check ${item.checked?'checked':''}" onclick="toggleShopping('${item.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>
        </div>
        <div class="todo-text ${item.checked?'done':''}">${escapeHtml(item.text)}</div>
        <button class="todo-del" onclick="deleteShoppingItem('${item.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B7AF9E" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`;
    });
    html += `</div>`;
  }
  html += `
  <div class="add-row">
    <input type="text" id="shopInput" placeholder="살 것을 입력하세요" onkeydown="if(event.key==='Enter') submitShopping()">
    <button onclick="submitShopping()">+</button>
  </div>`;

  html += `</div>`;
  return html;
}
function submitTodo(){
  const el = document.getElementById('todoInput');
  const text = el.value.trim();
  if(!text) return;
  const dateStr = fmtDate(selectedDate);
  if(!todos[dateStr]) todos[dateStr] = [];
  todos[dateStr].push({ id: uid(), text, checked:false });
  saveTodos();
  render();
  setTimeout(()=>{ const ne=document.getElementById('todoInput'); if(ne) ne.focus(); }, 0);
}
function toggleTodo(id){
  const loc = findTodoLocation(id);
  if(!loc) return;
  todos[loc.date][loc.idx].checked = !todos[loc.date][loc.idx].checked;
  saveTodos();
  render();
}
function deleteTodo(id){
  const loc = findTodoLocation(id);
  if(!loc) return;
  todos[loc.date].splice(loc.idx, 1);
  saveTodos();
  render();
}
function submitShopping(){
  const el = document.getElementById('shopInput');
  const text = el.value.trim();
  if(!text) return;
  shopping.push({ id: uid(), text, checked:false });
  saveShopping();
  render();
  setTimeout(()=>{ const ne=document.getElementById('shopInput'); if(ne) ne.focus(); }, 0);
}
function toggleShopping(id){
  const item = shopping.find(i=>i.id===id);
  if(item) item.checked = !item.checked;
  saveShopping();
  render();
}
function deleteShoppingItem(id){
  shopping = shopping.filter(i=>i.id!==id);
  saveShopping();
  render();
}

loadData();
</script>
</body>
</html>
